<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Wisp</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="top-bar">
      <div class="logo"><span class="logo-dot"></span>Wisp</div>
      <button id="connectionButton" class="status-pill" type="button">
        <span id="connectionDot" class="dot"></span>
        <span id="connectionText" class="status-text">连接服务器</span>
      </button>
    </header>

    <div class="main">
      <aside id="sidebar" class="session-list disabled">
        <div class="session-header">
          <button id="newSessionButton" class="new-btn" type="button" disabled><span class="plus">+</span> 新会话</button>
        </div>
        <div id="sessionItems" class="session-items"></div>
      </aside>

      <section class="chat-area">
        <div id="notConnected" class="not-connected">
          <div class="welcome-icon">✦</div>
          <div class="welcome-title">Wisp</div>
          <div class="not-connected-text">尚未连接服务器，连接后即可开始对话</div>
          <button id="centerConnectButton" class="primary-button" type="button">连接服务器</button>
        </div>

        <div id="chatConnected" class="chat-connected hidden">
          <div id="messagesScroller" class="messages">
            <div id="messagesInner" class="messages-inner">
              <div id="notice" class="notice hidden"></div>
              <div id="emptyChat" class="empty-chat">
                <div class="empty-title">开始一段对话</div>
                <div class="empty-sub">消息将发送给当前选中的模型</div>
              </div>
              <div id="messageList"></div>
            </div>
          </div>

          <div class="composer">
            <div class="composer-card">
              <textarea id="composerInput" rows="1" placeholder="向 Wisp 发送消息…" aria-label="消息"></textarea>
              <div class="composer-bar">
                <div class="bar-left">
                  <select id="modelSelect" class="pill-select model-select" aria-label="模型"></select>
                  <select id="thinkingSelect" class="pill-select thinking-select" aria-label="思考深度"></select>
                </div>
                <button id="sendButton" class="send-btn" type="button" aria-label="发送" title="发送 (Enter)">
                  <svg id="sendIcon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 2.5v11M8 2.5L3.5 7M8 2.5L12.5 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" /></svg>
                  <svg id="stopIcon" class="hidden" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="2" fill="currentColor" /></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <div id="connectModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="connectTitle">
    <div class="modal-card">
      <div id="connectTitle" class="modal-title">连接服务器</div>
      <input id="serverUrlInput" class="modal-input" type="text" placeholder="http://127.0.0.1:7860" />
      <div id="connectError" class="modal-error hidden"></div>
      <div class="modal-footer">
        <button id="connectCancel" class="secondary-button" type="button">取消</button>
        <button id="connectSubmit" class="primary-button small" type="button">连接</button>
      </div>
    </div>
  </div>

  <div id="renameModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="renameTitle">
    <div class="modal-card">
      <div id="renameTitle" class="modal-title">重命名会话</div>
      <input id="renameInput" class="modal-input" type="text" placeholder="新标题" />
      <div class="modal-footer">
        <button id="renameCancel" class="secondary-button" type="button">取消</button>
        <button id="renameSubmit" class="primary-button small" type="button">保存</button>
      </div>
    </div>
  </div>

  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
